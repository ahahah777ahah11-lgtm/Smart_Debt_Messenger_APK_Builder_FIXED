name: Build Smart Debt Messenger APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Verify Android project
        working-directory: html-to-apk-builder
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/assets/www/index.html

      - name: Build Debug APK
        working-directory: html-to-apk-builder
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Debt-Messenger-debug-apk
          path: html-to-apk-builder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        working-directory: html-to-apk-builder
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Debt-Messenger-release-apk
          path: html-to-apk-builder/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
